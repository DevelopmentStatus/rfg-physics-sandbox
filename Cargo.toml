[workspace]
resolver = "3"
members = [
    "Crates/physics",
    "Crates/destruction",
    "Sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
license = "MIT"

[workspace.dependencies]
bevy = "=0.19.1"
avian3d = "=0.7.0"
dear-imgui-bevy = "=0.18.0"
dear-imgui-rs = "=0.18.0"

# Optimize dependencies (Bevy, Avian, ImGui) in debug builds; the debug physics was ~250 ms/frame.
# Workspace crates keep opt-level 1 so incremental rebuilds stay quick.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
